server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # Do not advertise the nginx version.
    server_tokens off;

    # Security headers. nginx only inherits server-level add_header into a
    # location that has no add_header of its own; the static-assets and
    # /index.html locations below set Cache-Control, so they repeat what they
    # need. (Before this, the HTML every SPA route is served from — the
    # /index.html location — carried none of these headers.)
    # X-XSS-Protection is intentionally gone: obsolete, and the old XSS auditor
    # it enabled could itself be abused; the CSP on index.html replaces it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # SPA Routing: all requests that don't match a static file redirect to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching. Vite fingerprints these filenames per build
    # (e.g. index-<hash>.js), so a long cache is safe — a new deploy always
    # ships a new filename, never reuses a stale cached one.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html is the one file that must never be served stale: it's what
    # references the current build's fingerprinted asset filenames, and it
    # has no fingerprint of its own. try_files above internally redirects
    # every SPA route to this same exact-match location, so this also
    # covers e.g. /students, not just a literal request for /index.html.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # CSP, kept identical to the one in vercel.json. Why each source:
        #  - script-src 'self': Vite emits only external module scripts (no
        #    inline script, no eval), so XSS payloads cannot run inline.
        #  - style-src 'unsafe-inline': MUI/emotion inject <style> elements at
        #    runtime; this allows only CSS, not script.
        #  - img-src https: data: blob: — user photos are absolute URLs chosen by
        #    the backend (host not fixed), previews use blob:, a few icons data:.
        #  - connect-src: the API origin is hard-coded in baseApi.tsx.
        #  - frame-ancestors 'none' + object-src 'none' + base-uri 'self':
        #    no clickjacking, plugins or <base> hijacking; form-action 'self'.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.youngadults-crm.uz; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Health check endpoint for Docker / Load Balancer
    location /health {
        access_log off;
        return 200 "OK";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
