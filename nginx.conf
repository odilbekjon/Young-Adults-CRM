server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA Routing: all requests that don't match a static file redirect to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching. Vite fingerprints these filenames per build
    # (e.g. index-<hash>.js), so a long cache is safe — a new deploy always
    # ships a new filename, never reuses a stale cached one.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # index.html is the one file that must never be served stale: it's what
    # references the current build's fingerprinted asset filenames, and it
    # has no fingerprint of its own. try_files above internally redirects
    # every SPA route to this same exact-match location, so this also
    # covers e.g. /students, not just a literal request for /index.html.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Health check endpoint for Docker / Load Balancer
    location /health {
        access_log off;
        return 200 "OK";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
