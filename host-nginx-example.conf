# ==============================================================================
# VPS Server Host Nginx Configuration
# Server path: /etc/nginx/sites-available/youngadults-crm.conf
# Activate:    sudo ln -s /etc/nginx/sites-available/youngadults-crm.conf /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload:      sudo systemctl reload nginx
# SSL Cert:    sudo certbot --nginx -d youngadults-crm.uz -d www.youngadults-crm.uz -d api.youngadults-crm.uz
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND: youngadults-crm.uz va www.youngadults-crm.uz
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name youngadults-crm.uz www.youngadults-crm.uz;

    # Do not advertise the nginx version (Server header / error pages).
    server_tokens off;

    # HSTS: TLS terminates on this host (certbot --nginx adds the 443 listener
    # to this block), so this is the place for it, not the Docker nginx. The
    # other security headers and the CSP come from the container's nginx.conf
    # and pass through proxy_pass. No includeSubDomains/preload on purpose.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # HTTP/2: browsers open at most 6 connections per host over HTTP/1.1 (the live
    # site negotiates http/1.1 today), so the app's many small files and requests
    # queue behind each other. After `certbot --nginx` has added the TLS listener,
    # change it to `listen 443 ssl http2;` (nginx 1.24; `http2 on;` from 1.25.1).
    # Do the same in the api.youngadults-crm.uz block below.

    # Frontend Docker konteyneriga yo'naltirish (port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support (agar Vite HMR / real-time frontend kerak bo'lsa)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 50M;
}

# ------------------------------------------------------------------------------
# 2. BACKEND API: api.youngadults-crm.uz
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.youngadults-crm.uz;

    # Do not advertise the nginx version. (HSTS is not added here: the API app
    # already sends its own Strict-Transport-Security, a second one is ignored.)
    server_tokens off;

    # Let the browser remember a CORS preflight. Every request the app sends carries
    # an Authorization header, so the browser first sends an OPTIONS "preflight" and
    # only then the real request - two round trips. The API answers the preflight
    # without Access-Control-Max-Age, so browsers keep it for 5 seconds only (Chrome
    # accepts at most 7200) and a page that loads 15 lists pays 15 extra round trips
    # every time it is opened. The header is harmless on ordinary responses.
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Max-Age 7200 always;

    # Compress the JSON lists (a 1000-row page shrinks to a fraction of its size).
    # nginx does not compress a response the app has already compressed itself.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json;

    # Backend NestJS Docker konteyneriga yo'naltirish (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Socket.io qo'llab-quvvatlash
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (fayl yuklash va og'ir so'rovlar uchun)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Fayl yuklash hajmi cheklovi
    client_max_body_size 100M;
}

